name: Metrics

on:
  schedule: [{ cron: "0 16 * * *" }] # 每天 00:00 CST (16:00 UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/Metrics.yml]

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          user: draco-china
          config_timezone: Asia/Shanghai
          committer_message: "chore: update metrics"
          template: classic
          base: header, repositories

          # Keep the profile compact and avoid expensive deep repository scans.
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_details: percentage
          plugin_languages_indepth: no
